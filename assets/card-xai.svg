<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-label="XAI-Vision: audits computer vision models for dataset bias and shortcut learning.">
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="1" y="1" width="1038" height="378" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text class="sans" x="48" y="94" font-size="42" font-weight="700" fill="#e6edf3">XAI-Vision</text>
  <g class="sans" font-size="23" fill="#8b949e">
    <text x="48" y="150">Audits vision models for dataset</text>
    <text x="48" y="188">bias and shortcut learning, so you</text>
    <text x="48" y="226">see what a model really looks at.</text>
  </g>
  <text class="mono" x="48" y="330" font-size="19" letter-spacing="2" fill="#6e7681">PYTHON · DEEP LEARNING · XAI</text>

  <!-- panel: attention heatmap -->
  <rect x="638" y="62" width="354" height="226" rx="12" fill="#05070a" stroke="#30363d"/>
  <g transform="translate(656 80)">
    <!-- 6 x 5 grid of cells -->
    <g fill="#161b22">
      <rect x="0" y="0" width="38" height="36" rx="3"/><rect x="40" y="0" width="38" height="36" rx="3"/><rect x="80" y="0" width="38" height="36" rx="3"/><rect x="120" y="0" width="38" height="36" rx="3"/><rect x="160" y="0" width="38" height="36" rx="3"/><rect x="200" y="0" width="38" height="36" rx="3"/>
      <rect x="0" y="38" width="38" height="36" rx="3"/><rect x="40" y="38" width="38" height="36" rx="3"/><rect x="80" y="38" width="38" height="36" rx="3"/><rect x="120" y="38" width="38" height="36" rx="3"/><rect x="160" y="38" width="38" height="36" rx="3"/><rect x="200" y="38" width="38" height="36" rx="3"/>
      <rect x="0" y="76" width="38" height="36" rx="3"/><rect x="40" y="76" width="38" height="36" rx="3"/><rect x="80" y="76" width="38" height="36" rx="3"/><rect x="120" y="76" width="38" height="36" rx="3"/><rect x="160" y="76" width="38" height="36" rx="3"/><rect x="200" y="76" width="38" height="36" rx="3"/>
      <rect x="0" y="114" width="38" height="36" rx="3"/><rect x="40" y="114" width="38" height="36" rx="3"/><rect x="80" y="114" width="38" height="36" rx="3"/><rect x="120" y="114" width="38" height="36" rx="3"/><rect x="160" y="114" width="38" height="36" rx="3"/><rect x="200" y="114" width="38" height="36" rx="3"/>
      <rect x="0" y="152" width="38" height="36" rx="3"/><rect x="40" y="152" width="38" height="36" rx="3"/><rect x="80" y="152" width="38" height="36" rx="3"/><rect x="120" y="152" width="38" height="36" rx="3"/><rect x="160" y="152" width="38" height="36" rx="3"/><rect x="200" y="152" width="38" height="36" rx="3"/>
    </g>
    <!-- hot cells: model attends to the background corner -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.8s" fill="freeze"/>
      <rect x="200" y="0" width="38" height="36" rx="3" fill="#f85149"/>
      <rect x="160" y="0" width="38" height="36" rx="3" fill="#da3633" opacity="0.8"/>
      <rect x="200" y="38" width="38" height="36" rx="3" fill="#da3633" opacity="0.8"/>
      <rect x="160" y="38" width="38" height="36" rx="3" fill="#d29922" opacity="0.6"/>
      <rect x="120" y="0" width="38" height="36" rx="3" fill="#d29922" opacity="0.45"/>
      <rect x="200" y="76" width="38" height="36" rx="3" fill="#d29922" opacity="0.45"/>
    </g>
    <!-- the actual object, barely used -->
    <rect x="38" y="74" width="82" height="116" rx="4" fill="#39c5cf" fill-opacity="0.08" stroke="#39c5cf" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="mono" x="44" y="181" font-size="12" fill="#39c5cf">OBJECT</text>
    <text class="mono" x="252" y="22" font-size="11" fill="#8b949e">hi</text>
    <text class="mono" x="252" y="186" font-size="11" fill="#8b949e">lo</text>
    <rect x="270" y="6" width="8" height="180" rx="4" fill="#161b22"/>
    <rect x="270" y="6" width="8" height="60" rx="4" fill="#f85149"/>
  </g>

  <text class="mono" x="638" y="330" font-size="20" fill="#e6edf3">focus: background <tspan fill="#f85149">×</tspan> <tspan fill="#f85149" font-weight="700">SHORTCUT</tspan></text>
</svg>
