<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-label="The letters HUSSEIN are traced onto a grid while an OBD-II scanner session runs beside them.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cmd { fill: #39c5cf; }
    .arg { fill: #e6edf3; }
    .cmt { fill: #8b949e; }
    .ok  { fill: #3fb950; }
    .ln  { opacity: 0; }
    .ltr { fill: none; stroke: #e6edf3; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1b222c" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1038" height="328" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- left: grid with name -->
  <rect x="34" y="44" width="504" height="234" rx="8" fill="url(#grid)" stroke="#1f262f"/>
  <g transform="translate(53 101)">
    <!-- H -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M0 0V120M46 0V120M0 60H46">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.2s" dur="0.45s" fill="freeze"/>
    </path>
    <!-- U -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="translate(70 0)" d="M0 0V97A23 23 0 0 0 46 97V0">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.65s" dur="0.45s" fill="freeze"/>
    </path>
    <!-- S -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="translate(140 0)" d="M44 14Q39 0 23 0Q2 0 2 28Q2 53 23 59Q46 65 46 92Q46 120 23 120Q5 120 0 104">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.1s" dur="0.45s" fill="freeze"/>
    </path>
    <!-- S -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="translate(210 0)" d="M44 14Q39 0 23 0Q2 0 2 28Q2 53 23 59Q46 65 46 92Q46 120 23 120Q5 120 0 104">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.55s" dur="0.45s" fill="freeze"/>
    </path>
    <!-- E -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="translate(280 0)" d="M46 0H0V120H46M0 60H37">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2s" dur="0.45s" fill="freeze"/>
    </path>
    <!-- I -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="translate(350 0)" d="M7 0H39M23 0V120M7 120H39">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.45s" dur="0.45s" fill="freeze"/>
    </path>
    <!-- N -->
    <path class="ltr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="translate(420 0)" d="M0 120V0L46 120V0">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.9s" dur="0.45s" fill="freeze"/>
    </path>
  </g>
  <text class="mono" x="40" y="300" font-size="11" fill="#484f58">0x00</text>
  <text class="mono" x="532" y="300" font-size="11" fill="#484f58" text-anchor="end">0xFF</text>

  <!-- right: scanner session -->
  <g class="mono" font-size="14.5">
    <text x="582" y="64" font-size="11.5" fill="#484f58">hussein-h.obd</text>
    <line x1="582" y1="76" x2="1005" y2="76" stroke="#21262d"/>

    <text class="ln" x="582" y="104"><tspan class="cmd">ATZ</tspan><tspan class="cmt" x="722">; reset the scanner</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.15s" fill="freeze"/></text>
    <text class="ln" x="582" y="130"><tspan class="cmd">ATSP0</tspan><tspan class="cmt" x="722">; auto-detect protocol</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.15s" fill="freeze"/></text>
    <text class="ln" x="582" y="156"><tspan class="cmd">03</tspan><tspan class="arg"> P0420</tspan><tspan class="cmt" x="722">; build: tools that diagnose</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.15s" fill="freeze"/></text>
    <text class="ln" x="582" y="182"><tspan class="cmd">09</tspan><tspan class="arg"> XAI</tspan><tspan class="cmt" x="722">; build: models that explain</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.15s" fill="freeze"/></text>
    <text class="ln" x="582" y="208"><tspan class="cmd">01</tspan><tspan class="arg"> 0C</tspan><tspan class="cmt" x="722">; build: raw data → answers</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.15s" fill="freeze"/></text>
    <text class="ln" x="582" y="234"><tspan class="cmd">ATI</tspan><tspan class="ok"> Python · ML · computer vision</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.15s" fill="freeze"/></text>
    <text class="ln" x="582" y="260"><tspan class="cmd">ATMA</tspan><tspan class="cmt" x="722">; monitor all (always)</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.15s" fill="freeze"/></text>
    <rect x="912" y="247" width="8" height="17" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- progress bar -->
  <rect x="582" y="282" width="423" height="5" rx="2.5" fill="#161b22"/>
  <rect x="582" y="282" width="0" height="5" rx="2.5" fill="#39c5cf">
    <animate attributeName="width" from="0" to="423" begin="0.2s" dur="3.4s" fill="freeze"/>
  </rect>
</svg>
