<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" role="img" aria-label="Senior Design Management System: developer on the deployed University of Michigan-Dearborn Senior Design portal at seniordesign.engin.umd.umich.edu.">
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="1" y="1" width="1038" height="248" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- left: text -->
  <text class="mono" x="40" y="50" font-size="12.5" letter-spacing="2" fill="#39c5cf">DEVELOPER · DEPLOYED</text>
  <text class="sans" x="40" y="88" font-size="27" font-weight="700" fill="#e6edf3">Senior Design Management System</text>
  <g class="sans" font-size="16.5" fill="#8b949e">
    <text x="40" y="122">The University of Michigan-Dearborn Senior Design portal:</text>
    <text x="40" y="146">organizations submit ideas, faculty review, student teams build.</text>
  </g>
  <text class="mono" x="40" y="186" font-size="16" fill="#39c5cf" text-decoration="underline">seniordesign.engin.umd.umich.edu ↗</text>
  <text class="mono" x="40" y="224" font-size="13" letter-spacing="1.5" fill="#6e7681">TYPESCRIPT · REACT · EXPRESS · POSTGRESQL</text>

  <!-- right: browser window -->
  <rect x="600" y="28" width="400" height="168" rx="10" fill="#05070a" stroke="#30363d"/>
  <path d="M600 38a10 10 0 0 1 10-10h380a10 10 0 0 1 10 10v16H600z" fill="#161b22"/>
  <circle cx="616" cy="41" r="4" fill="#f85149" opacity="0.7"/>
  <circle cx="630" cy="41" r="4" fill="#d29922" opacity="0.7"/>
  <circle cx="644" cy="41" r="4" fill="#3fb950" opacity="0.7"/>
  <rect x="660" y="33" width="326" height="16" rx="8" fill="#0d1117"/>
  <text class="mono" x="672" y="45" font-size="10.5" fill="#8b949e">seniordesign.engin.umd.umich.edu</text>

  <!-- five-step flow -->
  <line x1="636" y1="104" x2="964" y2="104" stroke="#21262d" stroke-width="3"/>
  <line x1="636" y1="104" x2="636" y2="104" stroke="#39c5cf" stroke-width="3">
    <animate attributeName="x2" from="636" to="964" begin="0.3s" dur="2s" fill="freeze"/>
  </line>
  <g class="mono" font-size="11" text-anchor="middle">
    <circle cx="636" cy="104" r="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" to="#39c5cf" begin="0.3s" dur="0.1s" fill="freeze"/></circle>
    <circle cx="718" cy="104" r="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" to="#39c5cf" begin="0.8s" dur="0.1s" fill="freeze"/></circle>
    <circle cx="800" cy="104" r="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" to="#39c5cf" begin="1.3s" dur="0.1s" fill="freeze"/></circle>
    <circle cx="882" cy="104" r="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" to="#39c5cf" begin="1.8s" dur="0.1s" fill="freeze"/></circle>
    <circle cx="964" cy="104" r="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" to="#3fb950" begin="2.3s" dur="0.1s" fill="freeze"/></circle>
    <text x="636" y="108" fill="#e6edf3">1</text>
    <text x="718" y="108" fill="#e6edf3">2</text>
    <text x="800" y="108" fill="#e6edf3">3</text>
    <text x="882" y="108" fill="#e6edf3">4</text>
    <text x="964" y="108" fill="#e6edf3">5</text>
    <g font-size="10" letter-spacing="1" fill="#8b949e">
      <text x="636" y="138">SUBMIT</text>
      <text x="718" y="138">REVIEW</text>
      <text x="800" y="138">MATCH</text>
      <text x="882" y="138">BUILD</text>
      <text x="964" y="138">DEMO</text>
    </g>
  </g>
  <rect x="616" y="156" width="368" height="26" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text class="mono" x="800" y="173" font-size="10.5" letter-spacing="1" fill="#6e7681" text-anchor="middle">ORGANIZATIONS · FACULTY · STUDENT TEAMS</text>

  <!-- status -->
  <circle cx="606" cy="221" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="mono" x="618" y="226" font-size="14" fill="#e6edf3">DEPLOYED <tspan fill="#8b949e">· university server · team of 4</tspan></text>
</svg>
