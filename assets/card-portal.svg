<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" role="img" aria-label="Senior Design Project Portal: developer on the live portal where clients submit project ideas, instructors review them, and students pick what to build.">
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .in { opacity: 0; }
  </style>
  <rect x="1" y="1" width="1038" height="248" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- left: text -->
  <text class="mono" x="40" y="56" font-size="12.5" letter-spacing="2" fill="#39c5cf">DEVELOPER</text>
  <text class="sans" x="40" y="96" font-size="30" font-weight="700" fill="#e6edf3">Senior Design Project Portal</text>
  <g class="sans" font-size="16.5" fill="#8b949e">
    <text x="40" y="132">The live portal behind our senior design program:</text>
    <text x="40" y="156">clients submit project ideas, instructors review them,</text>
    <text x="40" y="180">and students pick what to build.</text>
  </g>
  <text class="mono" x="40" y="220" font-size="13" letter-spacing="1.5" fill="#6e7681">TEAM PROJECT · WEB APP · IN PRODUCTION</text>

  <!-- right: browser window -->
  <rect x="600" y="28" width="400" height="168" rx="10" fill="#05070a" stroke="#30363d"/>
  <path d="M600 38a10 10 0 0 1 10-10h380a10 10 0 0 1 10 10v16H600z" fill="#161b22"/>
  <circle cx="616" cy="41" r="4" fill="#f85149" opacity="0.7"/>
  <circle cx="630" cy="41" r="4" fill="#d29922" opacity="0.7"/>
  <circle cx="644" cy="41" r="4" fill="#3fb950" opacity="0.7"/>
  <rect x="660" y="33" width="326" height="16" rx="8" fill="#0d1117"/>
  <text class="mono" x="672" y="45" font-size="10.5" fill="#8b949e">seniordesign.engin.umd.umich.edu</text>

  <!-- pipeline columns -->
  <g class="mono" font-size="10" letter-spacing="1" fill="#6e7681">
    <text x="616" y="76">SUBMITTED</text>
    <text x="746" y="76">IN REVIEW</text>
    <text x="876" y="76">ADOPTED</text>
  </g>
  <g fill="#161b22" stroke="#30363d">
    <rect class="in" x="616" y="86" width="112" height="26" rx="5"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="616" y="118" width="112" height="26" rx="5"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="616" y="150" width="112" height="26" rx="5"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="746" y="86" width="112" height="26" rx="5" stroke="#d29922"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="746" y="118" width="112" height="26" rx="5" stroke="#d29922"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="876" y="86" width="108" height="26" rx="5" stroke="#3fb950"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/></rect>
  </g>
  <g fill="#30363d">
    <rect class="in" x="626" y="97" width="70" height="4" rx="2"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="626" y="129" width="56" height="4" rx="2"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="626" y="161" width="80" height="4" rx="2"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="756" y="97" width="64" height="4" rx="2"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="756" y="129" width="78" height="4" rx="2"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/></rect>
    <rect class="in" x="886" y="97" width="60" height="4" rx="2" fill="#3fb950" opacity="0.6"><animate attributeName="opacity" from="0" to="0.6" begin="1.5s" dur="0.3s" fill="freeze"/></rect>
  </g>

  <!-- status -->
  <circle cx="606" cy="221" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="mono" x="618" y="226" font-size="14" fill="#e6edf3">LIVE <tspan fill="#8b949e">· clients · instructors · students</tspan></text>
</svg>
